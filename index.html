<style>
:root {
  --bg:        #f5f5f5;
  --bg2:       #ffffff;
  --surface:   #ffffff;
  --surface2:  #f0f0f0;
  --surface3:  #e0e0e0;
  --ink:       #1a1a2e;
  --ink2:      #4a4a6a;
  --muted:     #9090a8;
  --rule:      #e8e8f0;
  --accent:    #01b4e4;
  --accent2:   #0d253f;
  --soon:      #e8a000;
  --stream:    #16a34a;
  --done:      #8b5cf6;
  --radius:    10px;
  --radius-sm: 6px;
  --font-title: 'Bebas Neue', sans-serif;
  --font-body:  'DM Sans', sans-serif;
  --safe-top:   env(safe-area-inset-top, 0px);
  --safe-bot:   env(safe-area-inset-bottom, 0px);
  --shadow:     0 2px 12px rgba(0,0,0,0.08);
  --shadow-md:  0 4px 24px rgba(0,0,0,0.12);
  --navh:       58px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--rule);
  padding: calc(var(--safe-top) + 10px) 20px 10px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-family: var(--font-title);
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--accent2);
  line-height: 1;
}
.logo span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-icon {
  background: var(--surface2);
  border: 1px solid var(--rule);
  color: var(--ink2);
  border-radius: var(--radius-sm);
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 13px;
  transition: all 0.15s;
}
.btn-icon:hover { background: var(--surface3); color: var(--ink); }

/* ─── MAIN ─── */
#appContent { min-height: calc(100vh - 60px); padding-bottom: calc(var(--navh) + var(--safe-bot) + 8px); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ─── SECTION TITLE ─── */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 24px 20px 12px;
}
.section-title { font-family: var(--font-title); font-size: 26px; letter-spacing: 0.5px; color: var(--ink); }
.section-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.subsection-title {
  padding: 18px 16px 8px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
  display: flex; align-items: center; gap: 7px;
}
.subsection-title .pill-count {
  background: var(--surface2); color: var(--ink2); font-size: 10px;
  padding: 1px 7px; border-radius: 8px; font-weight: 600;
}

/* ─── SEARCH BAR ─── */
.search-bar { padding: 0 20px 14px; }
.search-row {
  display: flex; background: var(--surface2); border-radius: var(--radius);
  border: 1.5px solid var(--rule); overflow: hidden; transition: border-color 0.2s;
}
.search-row:focus-within { border-color: var(--accent); }
.search-row input {
  flex: 1; background: none; border: none; outline: none;
  padding: 10px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); min-width: 0;
}
.search-row input::placeholder { color: var(--muted); }
.btn-search {
  background: var(--accent); color: #fff; border: none; padding: 0 18px;
  font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn-search:hover { opacity: 0.88; }
.btn-search:disabled { opacity: 0.4; cursor: default; }

/* ─── SUB TABS (segmented) ─── */
.sub-tabs { display: flex; gap: 8px; padding: 0 20px 14px; flex-wrap: wrap; }
.sub-btn {
  padding: 7px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink2);
  transition: all 0.15s; font-family: var(--font-body);
}
.sub-btn.active { background: rgba(1,180,228,0.1); color: var(--accent); border-color: rgba(1,180,228,0.4); }
.sub-panel { display: none; }
.sub-panel.visible { display: block; }

/* ─── SERIES GRID + CARD ─── */
.series-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 16px; padding: 0 16px 28px;
}
@media (min-width: 600px) { .series-grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 20px; padding: 0 24px 36px; } }

.series-card { position: relative; border-radius: var(--radius); cursor: pointer; transition: transform 0.2s; }
.series-card:hover { transform: translateY(-3px); }
.card-poster-wrap {
  position: relative; border-radius: var(--radius); overflow: hidden;
  aspect-ratio: 2/3; background: var(--surface2); box-shadow: var(--shadow);
}
.card-poster { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
.series-card:hover .card-poster { transform: scale(1.03); }
.card-poster-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--muted); }

.score-badge {
  position: absolute; top: 7px; left: 7px; background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px); color: var(--ink); font-size: 11px; font-weight: 600;
  padding: 3px 7px; border-radius: 20px; line-height: 1.4; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.status-chip {
  position: absolute; bottom: 7px; left: 7px; right: 7px; text-align: center;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); font-size: 10px; font-weight: 600;
  padding: 3px 6px; border-radius: var(--radius-sm); box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.status-chip.ended  { color: var(--done); }
.status-chip.wait   { color: var(--soon); }

.btn-add-fav {
  position: absolute; top: 7px; right: 7px; width: 28px; height: 28px;
  background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); border: none; border-radius: 50%;
  color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s; z-index: 10;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.btn-add-fav:hover { background: var(--accent); color: #fff; transform: scale(1.15); }
.btn-add-fav.saved { background: var(--accent); color: #fff; }

.card-info { padding: 8px 2px 0; }
.card-title {
  font-size: 12px; font-weight: 500; color: var(--ink); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-date { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* ─── NEXT EPISODE ROW ─── */
.next-ep-row {
  display: flex; gap: 12px; padding: 12px 16px; align-items: center;
  border-bottom: 1px solid var(--rule); cursor: pointer;
}
.next-ep-row:hover { background: var(--surface2); }
.row-poster {
  width: 54px; height: 81px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
  box-shadow: var(--shadow); background: var(--surface2);
}
.row-poster-ph {
  width: 54px; height: 81px; border-radius: 8px; flex-shrink: 0; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--muted);
}
.next-ep-body { flex: 1; min-width: 0; }
.next-ep-name { font-weight: 600; font-size: 14px; color: var(--ink); line-height: 1.25; }
.next-ep-sub { font-size: 12px; color: var(--ink2); margin-top: 3px; }
.next-ep-sub .se { font-weight: 600; color: var(--accent); }
.next-ep-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
.next-ep-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.countdown-pill {
  background: rgba(1,180,228,0.1); color: var(--accent); border: 1px solid rgba(1,180,228,0.3);
  border-radius: 14px; padding: 4px 11px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.countdown-pill.soon { background: #fff8e6; color: var(--soon); border-color: rgba(232,160,0,0.4); }

.btn-ics {
  background: none; border: 1.5px solid var(--rule); color: var(--ink2); padding: 4px 9px;
  border-radius: var(--radius-sm); font-size: 10px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; font-family: var(--font-body);
}
.btn-ics:hover { background: var(--surface2); color: var(--ink); }
.btn-ics svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ─── WATCHLIST ROW ─── */
.wl-row {
  display: flex; gap: 12px; padding: 12px 16px; align-items: center; border-bottom: 1px solid var(--rule);
}
.wl-body { flex: 1; min-width: 0; cursor: pointer; }

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const API_KEY  = '729cf9f096e955020bb7d27c547be637';
const BASE_URL = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p';
const STORE_KEY   = 'seriestracker-v1';
const DETAILS_KEY = 'seriestracker-details-v1';
const DETAILS_TTL = 12 * 3600 * 1000; // refresh details après 12h

const STATUS_FR = {
  'Returning Series': 'En cours',
  'Ended': 'Terminée',
  'Canceled': 'Annulée',
  'In Production': 'En production',
  'Planned': 'Prévue',
  'Pilot': 'Pilote',
};
const STATUS_ACTIVE = ['Returning Series', 'In Production', 'Planned', 'Pilot'];

/* ═══════════════════════════════════════════
   STATE  (seul S est synchronisé / exporté)
═══════════════════════════════════════════ */
// S.series : séries suivies (objet minimal)
// S.watched : { [seriesId]: { "S-E": true } }  (épisode marqué vu)
let S = { series: [], watched: {} };

// Caches (locaux, régénérables — NON exportés)
let detailsCache = {};      // id -> { data, ts }   (persisté)
const epCache = {};         // id -> { all:[...], ts } (session uniquement)

function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = { series: [], watched: {}, ...JSON.parse(raw) }; } catch(e) {}
  if (!S.watched) S.watched = {};
  if (!S.series)  S.series  = [];
  try { const raw = localStorage.getItem(DETAILS_KEY); if (raw) detailsCache = JSON.parse(raw); } catch(e) {}
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e) {} }
function persistDetails() {
  try { localStorage.setItem(DETAILS_KEY, JSON.stringify(detailsCache)); }
  catch(e) { detailsCache = {}; } // quota dépassé → on abandonne le cache persistant
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function h(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n) { return String(n).padStart(2,'0'); }
function sxe(s, e) { return 'S' + pad2(s) + 'E' + pad2(e); }
function epKey(s, e) { return s + '-' + e; }

function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' }); }
function fmtDateLong(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('fr-FR', { weekday:'short', day:'numeric', month:'long', year:'numeric' }); }
function daysUntil(d) { const t = new Date(); t.setHours(0,0,0,0); const x = new Date(d); x.setHours(0,0,0,0); return Math.round((x - t) / 86400000); }
function isAired(dateStr) { if (!dateStr) return false; const t = new Date(); t.setHours(23,59,59,999); return new Date(dateStr) <= t; }
function daysLabel(n) {
  if (n < 0) return 'Diffusé';
  if (n === 0) return "Aujourd'hui";
  if (n === 1) return 'Demain';
  if (n < 7)  return 'Dans ' + n + ' jours';
  if (n < 30) return 'Dans ' + Math.round(n/7) + ' sem.';
  return 'Dans ' + Math.round(n/30) + ' mois';
}

function showToast(msg, dur=2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._to); t._to = setTimeout(() => t.classList.remove('show'), dur);
}

async function tmdb(path, params={}) {
  const url = new URL(BASE_URL + path);
  url.searchParams.set('api_key', API_KEY);
  url.searchParams.set('language', 'fr-FR');
  for (const [k,v] of Object.entries(params)) url.searchParams.set(k, v);
  const r = await fetch(url.toString());
  if (!r.ok) throw new Error('TMDB ' + r.status);
  return r.json();
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Détails série (avec watch/providers) — caché 12h */
async function ensureDetails(id, force=false) {
  const c = detailsCache[id];
  if (!force && c && (Date.now() - c.ts < DETAILS_TTL)) return c.data;
  const data = await tmdb('/tv/' + id, { append_to_response: 'watch/providers' });
  detailsCache[id] = { data, ts: Date.now() };
  persistDetails();
  return data;
}

/* Liste de tous les épisodes (saisons >= 1) — cache session */
async function ensureEpisodes(id, details) {
  const c = epCache[id];
  if (c) return c.all;
  const seasons = (details.seasons || []).filter(s => s.season_number >= 1);
  const all = [];
  for (const s of seasons) {
    try {
      const data = await tmdb('/tv/' + id + '/season/' + s.season_number);
      for (const ep of (data.episodes || [])) {
        all.push({
          season: ep.season_number, episode: ep.episode_number,
          name: ep.name, air_date: ep.air_date, runtime: ep.runtime,
        });
      }
    } catch(e) {}
    await sleep(120); // séquentiel + délai (fiabilité, cf. GitHub Pages)
  }
  epCache[id] = { all, ts: Date.now() };
  return all;
}

═══════════════════════════════════════════ */
function isFollowed(id) { return S.series.some(s => s.id === id); }

function toggleFollow(serie) {
  const idx = S.series.findIndex(s => s.id === serie.id);
  if (idx >= 0) {
    S.series.splice(idx, 1);
    showToast('✕ Retiré de mes séries');
  } else {
    S.series.push({
      id: serie.id, name: serie.name || serie.original_name,
      poster_path: serie.poster_path, backdrop_path: serie.backdrop_path,
      first_air_date: serie.first_air_date, vote_average: serie.vote_average,
    });
    showToast('★ Ajouté à mes séries');
  }
  saveState();
  updateBadges();
  document.querySelectorAll('.btn-add-fav[data-id="' + serie.id + '"]').forEach(b => {
    b.classList.toggle('saved', isFollowed(serie.id));
    b.textContent = isFollowed(serie.id) ? '★' : '+';
  });
  const mfb = document.getElementById('modal-fav-btn');
  if (mfb && Number(mfb.dataset.id) === serie.id) {
    mfb.className = 'modal-fav-btn' + (isFollowed(serie.id) ? ' saved' : '');
    mfb.innerHTML = isFollowed(serie.id) ? '★ Dans mes séries' : '☆ Ajouter à mes séries';
  }
  // invalider rendu des onglets dépendants
  watchlistBuilt = false;
}

function updateBadges() {
  const ms = document.getElementById('badge-myseries');
  ms.textContent = S.series.length || '';
  ms.classList.toggle('visible', S.series.length > 0);
  const wl = document.getElementById('badge-watchlist');
  wl.textContent = watchlistCount || '';
  wl.classList.toggle('visible', watchlistCount > 0);
}

function makePosterEl(serie, options={}) {
  const card = document.createElement('div');
  card.className = 'series-card';

  const wrap = document.createElement('div');
  wrap.className = 'card-poster-wrap';

  if (serie.poster_path) {
    const img = document.createElement('img');
    img.className = 'card-poster';
    img.src = IMG_BASE + '/w342' + serie.poster_path;
    img.alt = ''; img.loading = 'lazy';
    wrap.appendChild(img);
  } else {
    const ph = document.createElement('div'); ph.className = 'card-poster-ph'; ph.textContent = '📺';
    wrap.appendChild(ph);
  }

  if (serie.vote_average && serie.vote_average > 0) {
    const sc = document.createElement('div'); sc.className = 'score-badge';
    sc.textContent = '★ ' + serie.vote_average.toFixed(1);
    wrap.appendChild(sc);
  }

  const fav = document.createElement('button');
  fav.className = 'btn-add-fav' + (isFollowed(serie.id) ? ' saved' : '');
  fav.dataset.id = serie.id;
  fav.textContent = isFollowed(serie.id) ? '★' : '+';
  fav.title = 'Suivre';
  fav.addEventListener('click', e => { e.stopPropagation(); toggleFollow(serie); });
  wrap.appendChild(fav);

  if (options.statusChip) {
    const chip = document.createElement('div');
    chip.className = 'status-chip ' + (options.statusChip.cls || '');
    chip.textContent = options.statusChip.text;
    wrap.appendChild(chip);
  }

  const info = document.createElement('div'); info.className = 'card-info';
  const title = document.createElement('div'); title.className = 'card-title';
  title.textContent = serie.name || serie.original_name;
  info.appendChild(title);

  const date = document.createElement('div'); date.className = 'card-date';
  if (options.subline) { date.textContent = options.subline; }
  else if (serie.first_air_date) { date.textContent = new Date(serie.first_air_date).getFullYear(); }
  info.appendChild(date);

  card.appendChild(wrap);
  card.appendChild(info);
  card.addEventListener('click', () => openSerieModal(serie.id));
  return card;
}

function renderGrid(containerId, list, options={}) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  if (!list || !list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state'; empty.style.gridColumn = '1/-1';
    empty.innerHTML = '<div class="icon">📺</div><p>Aucune série trouvée</p>';
    grid.appendChild(empty); return;
  }
  for (const s of list) grid.appendChild(makePosterEl(s, options));
}
function appendToGrid(containerId, list, options={}) {
  const grid = document.getElementById(containerId);
  for (const s of list) grid.appendChild(makePosterEl(s, options));
}

function setLoadMore(gridId, hasMore, onMore) {
  const grid = document.getElementById(gridId);
  const wrapId = gridId + '-more';
  let wrap = document.getElementById(wrapId);
  if (!hasMore) { if (wrap) wrap.remove(); return; }
  if (!wrap) {
    wrap = document.createElement('div'); wrap.id = wrapId; wrap.className = 'load-more-wrap';
    const btn = document.createElement('button'); btn.className = 'btn-load-more'; btn.textContent = 'Afficher plus';
    wrap.appendChild(btn); grid.insertAdjacentElement('afterend', wrap);
  }
  const btn = wrap.querySelector('.btn-load-more');
  btn.onclick = async () => {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Chargement…';
    try { const more = await onMore(); if (!more) wrap.remove(); else { btn.disabled = false; btn.textContent = 'Afficher plus'; } }
    catch(e) { btn.disabled = false; btn.textContent = 'Réessayer'; }
  };
}

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('searchInput');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  inp.addEventListener('input', () => { if (!inp.value.trim()) clearSearch(); });
});

function clearSearch() {
  document.getElementById('searchStatus').style.display = 'none';
  document.getElementById('grid-search').style.display = 'none';
  document.getElementById('grid-search').innerHTML = '';
  document.getElementById('discover-browse').style.display = 'block';
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { clearSearch(); return; }
  const status = document.getElementById('searchStatus');
  const grid   = document.getElementById('grid-search');
  document.getElementById('discover-browse').style.display = 'none';
  status.className = 'status-note'; status.style.display = 'block'; status.textContent = 'Recherche en cours…';
  grid.style.display = 'none'; grid.innerHTML = '';
  document.getElementById('btnSearch').disabled = true;
  try {
    const data = await tmdb('/search/tv', { query: q, include_adult: false });
    const results = (data.results || []).filter(s => s.poster_path || s.name);
    document.getElementById('btnSearch').disabled = false;
    if (!results.length) { status.textContent = 'Aucun résultat pour « ' + q + ' »'; return; }
    status.textContent = results.length + ' résultat' + (results.length>1?'s':'') + ' pour « ' + q + ' »';
    grid.style.display = 'grid'; renderGrid('grid-search', results);
  } catch(e) {
    document.getElementById('btnSearch').disabled = false;
    status.className = 'status-note err'; status.textContent = 'Erreur : ' + e.message;
  }
}

const popState = { page: 0, total: 1, seen: new Set() };
const topState = { page: 0, total: 1, seen: new Set() };

async function loadPopular() {
  try {
    await fetchListPage('/tv/popular', popState, 'grid-popular', true);
    setLoadMore('grid-popular', popState.page < popState.total, () => fetchListPage('/tv/popular', popState, 'grid-popular', false));
  } catch(e) {
    document.getElementById('grid-popular').innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><p>Erreur de chargement</p></div>';
  }
}
async function loadTopRated() {
  const grid = document.getElementById('grid-top');
  grid.innerHTML = '<div class="loader-wrap" style="grid-column:1/-1"><div class="spinner"></div><span>Chargement…</span></div>';
  try {
    await fetchListPage('/tv/top_rated', topState, 'grid-top', true);
    setLoadMore('grid-top', topState.page < topState.total, () => fetchListPage('/tv/top_rated', topState, 'grid-top', false));
  } catch(e) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="icon">⚠️</div><p>Erreur de chargement</p></div>';
  }
}
async function fetchListPage(path, state, gridId, first) {
  let added = false, more = true;
  do {
    const data = await tmdb(path, { page: state.page + 1 });
    state.page = data.page; state.total = Math.min(data.total_pages, 500);
    more = state.page < state.total;
    const fresh = (data.results || []).filter(s => !state.seen.has(s.id) && s.poster_path);
    fresh.forEach(s => state.seen.add(s.id));
    if (fresh.length) { if (first && !added) renderGrid(gridId, fresh); else appendToGrid(gridId, fresh); added = true; }
  } while (!added && more);
  return more;
}

/* ═══════════════════════════════════════════
   MES SÉRIES
═══════════════════════════════════════════ */
async function renderMySeries() {
  const root = document.getElementById('myseries-content');
  const count = document.getElementById('myseries-count');
  count.textContent = S.series.length ? (S.series.length + ' série' + (S.series.length>1?'s':'')) : '';

  if (!S.series.length) {
    root.innerHTML = '<div class="empty-state"><div class="icon">★</div><p>Ajoutez des séries depuis Découverte avec le bouton +</p></div>';
    return;
  }

  root.innerHTML = '<div class="loader-wrap"><div class="spinner"></div><span>Chargement de vos séries…</span></div>';

  const next = [], waiting = [], ended = [];
  for (const s of S.series) {
    try {
      const d = await ensureDetails(s.id);
      const merged = { ...s, ...d };
      if (d.next_episode_to_air && d.next_episode_to_air.air_date) {
        next.push(merged);
      } else if (STATUS_ACTIVE.includes(d.status)) {
        waiting.push(merged);
      } else {
        ended.push(merged);
      }
    } catch(e) {
      ended.push({ ...s, status: '?' });
    }
  }
  next.sort((a,b) => new Date(a.next_episode_to_air.air_date) - new Date(b.next_episode_to_air.air_date));

  root.innerHTML = '';

  // ── Section 1 : prochain épisode ──
  root.appendChild(subTitle('⏭ Prochain épisode', next.length));
  if (!next.length) {
    root.appendChild(emptyLine('Aucune diffusion programmée pour le moment.'));
  } else {
    for (const s of next) root.appendChild(makeNextEpRow(s));
  }

  // ── Section 2 : en attente (actives, prochaine date inconnue) ──
  root.appendChild(subTitle('🕓 En attente d\'une date', waiting.length));
  if (!waiting.length) {
    root.appendChild(emptyLine('Aucune série en attente.'));
  } else {
    const g = document.createElement('div'); g.className = 'series-grid'; g.id = 'grid-waiting';
    root.appendChild(g);
    for (const s of waiting) g.appendChild(makePosterEl(s, { statusChip: { text: STATUS_FR[s.status] || 'En cours', cls: 'wait' } }));
  }

  // ── Section 3 : terminées ──
  root.appendChild(subTitle('✓ Terminées', ended.length));
  if (!ended.length) {
    root.appendChild(emptyLine('Aucune série terminée.'));
  } else {
    const g = document.createElement('div'); g.className = 'series-grid'; g.id = 'grid-ended';
    root.appendChild(g);
    for (const s of ended) g.appendChild(makePosterEl(s, { statusChip: { text: STATUS_FR[s.status] || 'Terminée', cls: 'ended' } }));
  }
}

function subTitle(text, count) {
  const el = document.createElement('div'); el.className = 'subsection-title';
  el.innerHTML = h(text) + ' <span class="pill-count">' + count + '</span>';
  return el;
}
function emptyLine(text) {
  const el = document.createElement('div'); el.className = 'status-note'; el.textContent = text; return el;
}

function makeNextEpRow(s) {
  const ne = s.next_episode_to_air;
  const row = document.createElement('div'); row.className = 'next-ep-row';
  row.addEventListener('click', () => openSerieModal(s.id));

  if (s.poster_path) {
    const img = document.createElement('img'); img.className = 'row-poster';
    img.src = IMG_BASE + '/w185' + s.poster_path; img.alt = ''; img.loading = 'lazy';
    row.appendChild(img);
  } else { const ph = document.createElement('div'); ph.className = 'row-poster-ph'; ph.textContent = '📺'; row.appendChild(ph); }

  const body = document.createElement('div'); body.className = 'next-ep-body';
  const name = document.createElement('div'); name.className = 'next-ep-name'; name.textContent = s.name || s.original_name;
  body.appendChild(name);

  const sub = document.createElement('div'); sub.className = 'next-ep-sub';
  const se = document.createElement('span'); se.className = 'se'; se.textContent = sxe(ne.season_number, ne.episode_number);
  sub.appendChild(se);
  if (ne.name) sub.appendChild(document.createTextNode(' · ' + ne.name));
  body.appendChild(sub);

  const meta = document.createElement('div'); meta.className = 'next-ep-meta';
  const dateSpan = document.createElement('span'); dateSpan.textContent = '📅 ' + fmtDate(ne.air_date);
  meta.appendChild(dateSpan);
  const net = (s.networks && s.networks[0]) ? s.networks[0].name : null;
  if (net) { const n = document.createElement('span'); n.textContent = '📡 ' + net; meta.appendChild(n); }
  if (ne.runtime) { const r = document.createElement('span'); r.textContent = '⏱ ' + ne.runtime + ' min'; meta.appendChild(r); }
  body.appendChild(meta);
  row.appendChild(body);

  const right = document.createElement('div'); right.className = 'next-ep-right';
  const days = daysUntil(ne.air_date);
  const pill = document.createElement('div'); pill.className = 'countdown-pill' + (days <= 2 ? ' soon' : '');
  pill.textContent = daysLabel(days);
  right.appendChild(pill);

  const ics = document.createElement('button'); ics.className = 'btn-ics';
  ics.innerHTML = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Calendrier';
  ics.addEventListener('click', e => {
    e.stopPropagation();
    downloadIcs((s.name || s.original_name), ne.air_date, sxe(ne.season_number, ne.episode_number) + (ne.name ? ' · ' + ne.name : ''));
  });
  right.appendChild(ics);
  row.appendChild(right);
  return row;
}

/* ═══════════════════════════════════════════
   WATCHLIST
═══════════════════════════════════════════ */
let watchlistBuilt = false;
let watchlistCount = 0;
let watchlistData = []; // { sid, name, poster_path, season, episode, epName, air_date, watched, total }

async function rebuildWatchlist(force) {
  const root = document.getElementById('watchlist-content');

  if (!S.series.length) {
    watchlistCount = 0; watchlistBuilt = true; updateBadges();
    root.innerHTML = '<div class="empty-state"><div class="icon">📺</div><p>Les épisodes diffusés de vos séries apparaîtront ici. Ajoutez d\'abord des séries.</p></div>';
    return;
  }
  if (watchlistBuilt && !force) { renderWatchlist(); return; }
  if (force) { for (const k in epCache) delete epCache[k]; }

  root.innerHTML = '<div class="loader-wrap"><div class="spinner"></div><span>Analyse des épisodes diffusés…</span></div>';

  const today = new Date(); today.setHours(23,59,59,999);
  const rows = [];
  for (const s of S.series) {
    try {
      const d = await ensureDetails(s.id);
      const eps = await ensureEpisodes(s.id, d);
      const total = d.number_of_episodes || eps.length;
      const w = S.watched[s.id] || {};
      for (const ep of eps) {
        if (!ep.air_date) continue;
        if (new Date(ep.air_date) > today) continue;     // pas encore diffusé
        if (w[epKey(ep.season, ep.episode)]) continue;    // déjà vu
        rows.push({
          sid: s.id, name: s.name || d.name, poster_path: s.poster_path || d.poster_path,
          season: ep.season, episode: ep.episode, epName: ep.name, air_date: ep.air_date, total,
        });
      }
    } catch(e) {}
  }
  rows.sort((a,b) => new Date(b.air_date) - new Date(a.air_date)); // plus récent en haut
  watchlistData = rows;
  watchlistCount = rows.length;
  watchlistBuilt = true;
  updateBadges();
  renderWatchlist();
}

function watchedCount(sid) {
  const w = S.watched[sid] || {};
  return Object.values(w).filter(Boolean).length;
}

/* Épisodes diffusés non vus (depuis le cache d'épisodes) */
function pendingCount(sid) {
  const c = epCache[sid]; if (!c) return 0;
  const w = S.watched[sid] || {};
  let n = 0;
  for (const ep of c.all) if (isAired(ep.air_date) && !w[epKey(ep.season, ep.episode)]) n++;
  return n;
}
function seasonPending(sid, sn) {
  const c = epCache[sid]; if (!c) return 0;
  const w = S.watched[sid] || {};
  let n = 0;
  for (const ep of c.all) if (ep.season === sn && isAired(ep.air_date) && !w[epKey(ep.season, ep.episode)]) n++;
  return n;
}
function recomputeWatchlistCount() {
  let n = 0;
  for (const s of S.series) n += pendingCount(s.id);
  watchlistCount = n;
  updateBadges();
}

function renderWatchlist() {
  const root = document.getElementById('watchlist-content');
  if (!watchlistData.length) {
    root.innerHTML = '<div class="empty-state"><div class="icon">✓</div><p>Aucun épisode en attente — vous êtes à jour !</p></div>';
    return;
  }
  // regroupement par série
  const groups = {};
  for (const r of watchlistData) {
    if (!groups[r.sid]) groups[r.sid] = { sid: r.sid, name: r.name, poster_path: r.poster_path, total: r.total, eps: [] };
    groups[r.sid].eps.push(r);
  }
  const arr = Object.values(groups);
  for (const g of arr) g.eps.sort((a, b) => a.season - b.season || a.episode - b.episode); // ordre de visionnage
  arr.sort((a, b) => maxAir(b.eps) - maxAir(a.eps)); // série la plus récemment diffusée en haut
  root.innerHTML = '';
  for (const g of arr) root.appendChild(makeWatchlistGroup(g));
}

function maxAir(eps) { let m = 0; for (const e of eps) { const t = new Date(e.air_date).getTime(); if (t > m) m = t; } return m; }

function makeWatchlistGroup(g) {
  const block = document.createElement('div'); block.className = 'wl-group';

  const head = document.createElement('div'); head.className = 'wl-group-head';

  const chev = document.createElement('span'); chev.className = 'season-chevron'; chev.textContent = '▶';
  head.appendChild(chev);

  if (g.poster_path) {
    const img = document.createElement('img'); img.className = 'wl-group-poster';
    img.src = IMG_BASE + '/w185' + g.poster_path; img.alt = ''; img.loading = 'lazy'; img.title = 'Voir la fiche';
    img.addEventListener('click', e => { e.stopPropagation(); openSerieModal(g.sid); });
    head.appendChild(img);
  } else {
    const ph = document.createElement('div'); ph.className = 'wl-group-poster-ph'; ph.textContent = '📺';
    head.appendChild(ph);
  }

  const info = document.createElement('div'); info.className = 'wl-group-info';
  const nm = document.createElement('div'); nm.className = 'wl-group-name'; nm.textContent = g.name;
  const cnt = document.createElement('div'); cnt.className = 'wl-group-count';
  info.appendChild(nm); info.appendChild(cnt);

  const prog = document.createElement('div'); prog.className = 'wl-progress'; prog.style.marginTop = '5px';
  const bar = document.createElement('div'); bar.className = 'wl-bar';
  const fill = document.createElement('div'); fill.className = 'wl-bar-fill';
  bar.appendChild(fill); prog.appendChild(bar);
  info.appendChild(prog);
  head.appendChild(info);

  const allBtn = document.createElement('button'); allBtn.className = 'season-toggle'; allBtn.title = 'Tout marquer comme vu'; allBtn.textContent = '✓';
  head.appendChild(allBtn);
  block.appendChild(head);

  const body = document.createElement('div'); body.className = 'wl-group-eps';
  block.appendChild(body);

  let built = false;

  function paintHeader(n) {
    cnt.textContent = n + ' épisode' + (n > 1 ? 's' : '') + ' à voir';
    const seen = watchedCount(g.sid);
    const pct = g.total ? Math.min(100, Math.round((seen / g.total) * 100)) : 0;
    fill.style.width = pct + '%';
  }
  paintHeader(g.eps.length);

  function removeGroup() {
    block.style.transition = 'opacity 0.2s, transform 0.2s';
    block.style.opacity = '0'; block.style.transform = 'translateX(20px)';
    setTimeout(() => {
      block.remove();
      const root = document.getElementById('watchlist-content');
      if (!root.querySelector('.wl-group')) {
        root.innerHTML = '<div class="empty-state"><div class="icon">✓</div><p>Aucun épisode en attente — vous êtes à jour !</p></div>';
      }
    }, 200);
  }

  // appelé par l'accordéon quand un épisode/saison change
  function onChange() {
    const n = pendingCount(g.sid);
    if (n <= 0) { removeGroup(); return; }
    paintHeader(n);
  }

  head.addEventListener('click', async () => {
    const opening = !block.classList.contains('open');
    block.classList.toggle('open');
    if (opening && !built) {
      built = true;
      body.innerHTML = '<div class="season-eps-loading"><div class="spinner"></div><span>Chargement…</span></div>';
      try {
        const d = (detailsCache[g.sid] && detailsCache[g.sid].data) || await ensureDetails(g.sid);
        const seasons = (d.seasons || [])
          .filter(s => s.season_number >= 1 && seasonPending(g.sid, s.season_number) > 0)
          .sort((a, b) => a.season_number - b.season_number);
        body.innerHTML = '';
        if (!seasons.length) { body.innerHTML = '<div class="season-eps-loading">Rien à voir.</div>'; return; }
        const acc = document.createElement('div'); acc.className = 'season-acc'; acc.style.padding = '8px 10px';
        for (const s of seasons) acc.appendChild(makeSeasonBlock(g.sid, g.sid, s, { onChange }));
        body.appendChild(acc);
      } catch(err) {
        body.innerHTML = '<div class="season-eps-loading">Erreur de chargement.</div>';
        built = false;
      }
    }
  });

  allBtn.addEventListener('click', e => {
    e.stopPropagation();
    const c = epCache[g.sid];
    if (!c) { showToast('Données en cours de chargement…'); return; }
    if (!S.watched[g.sid]) S.watched[g.sid] = {};
    let n = 0;
    for (const ep of c.all) {
      const k = epKey(ep.season, ep.episode);
      if (isAired(ep.air_date) && !S.watched[g.sid][k]) { S.watched[g.sid][k] = true; n++; }
    }
    if (!n) { showToast('Déjà à jour'); return; }
    saveState();
    invalidateWatchlist();
    const s = n > 1 ? 's' : '';
    showToast('✓ ' + n + ' épisode' + s + ' de « ' + g.name + ' » marqué' + s + ' vu' + s);
    removeGroup();
  });

  return block;
}

function markWatched(sid, season, episode) {
  if (!S.watched[sid]) S.watched[sid] = {};
  S.watched[sid][epKey(season, episode)] = true;
  saveState();
  showToast('✓ ' + sxe(season, episode) + ' marqué comme vu');
}

/* ═══════════════════════════════════════════
   STATISTIQUES
═══════════════════════════════════════════ */
async function renderStats() {
  const root = document.getElementById('stats-content');
  if (!S.series.length) {
    root.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>Ajoutez des séries pour voir vos statistiques</p></div>';
    return;
  }
  root.innerHTML = '<div class="loader-wrap"><div class="spinner"></div><span>Calcul des statistiques…</span></div>';

  let nbActive = 0, nbWait = 0, nbEnded = 0;
  let totalWatched = 0, totalMinutes = 0;
  const genreCount = {};

  for (const s of S.series) {
    try {
      const d = await ensureDetails(s.id);
      if (d.next_episode_to_air && d.next_episode_to_air.air_date) nbActive++;
      else if (STATUS_ACTIVE.includes(d.status)) nbWait++;
      else nbEnded++;

      const avgRun = (d.episode_run_time && d.episode_run_time.length) ? d.episode_run_time[0] : 0;
      const seen = watchedCount(s.id);
      totalWatched += seen;
      totalMinutes += seen * avgRun;

      for (const g of (d.genres || [])) genreCount[g.name] = (genreCount[g.name] || 0) + 1;
    } catch(e) {}
  }

  const hours = Math.round(totalMinutes / 60);
  const days = (totalMinutes / 1440).toFixed(1);

  root.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'stats-grid';
  grid.appendChild(statCard(S.series.length, 'Séries suivies', ''));
  grid.appendChild(statCard(nbActive + nbWait, 'En cours', 'stream'));
  grid.appendChild(statCard(nbEnded, 'Terminées', 'violet'));
  grid.appendChild(statCard(totalWatched, 'Épisodes vus', ''));
  grid.appendChild(statCard(hours + ' h', 'Temps de visionnage', 'soon'));
  grid.appendChild(statCard(days + ' j', 'Soit en jours', 'soon'));
  root.appendChild(grid);

  // top genres
  const genres = Object.entries(genreCount).sort((a,b) => b[1] - a[1]).slice(0, 6);
  if (genres.length) {
    const t = document.createElement('div'); t.className = 'subsection-title'; t.textContent = '🎭 Genres préférés';
    root.appendChild(t);
    const max = genres[0][1];
    const bars = document.createElement('div'); bars.className = 'genre-bars';
    for (const [name, n] of genres) {
      const r = document.createElement('div'); r.className = 'genre-row';
      const nm = document.createElement('div'); nm.className = 'genre-name'; nm.textContent = name;
      const tr = document.createElement('div'); tr.className = 'genre-track';
      const fl = document.createElement('div'); fl.className = 'genre-fill'; fl.style.width = Math.round((n/max)*100) + '%';
      tr.appendChild(fl);
      const v = document.createElement('div'); v.className = 'genre-val'; v.textContent = n;
      r.appendChild(nm); r.appendChild(tr); r.appendChild(v);
      bars.appendChild(r);
    }
    root.appendChild(bars);
  }

  const note = document.createElement('div'); note.className = 'status-note';
  note.textContent = 'Temps estimé à partir de la durée moyenne d\'épisode fournie par TMDB.';
  root.appendChild(note);
}
function statCard(num, lbl, cls) {
  const c = document.createElement('div'); c.className = 'stat-card';
  const n = document.createElement('div'); n.className = 'stat-num' + (cls ? ' ' + cls : ''); n.textContent = num;
  const l = document.createElement('div'); l.className = 'stat-lbl'; l.textContent = lbl;
  c.appendChild(n); c.appendChild(l); return c;
}

function pill(cls, text) { const s = document.createElement('span'); s.className = 'mpill ' + cls; s.textContent = text; return s; }
function sectionTitle(text) { const d = document.createElement('div'); d.className = 'modal-section-title'; d.textContent = text; return d; }

/* ── Saisons & épisodes (suivi par épisode) ── */
function seasonWatchedCount(sid, season) {
  const w = S.watched[sid] || {};
  let c = 0;
  for (const k in w) { if (w[k] && parseInt(k.split('-')[0], 10) === season) c++; }
  return c;
}

function invalidateWatchlist() {
  watchlistBuilt = false;          // reconstruction à la prochaine ouverture de l'onglet
  recomputeWatchlistCount();       // badge à jour sans reconstruire (ne replie pas l'accordéon)
}

function buildSeasonsSection(d, sid) {
  const frag = document.createDocumentFragment();
  frag.appendChild(sectionTitle('Saisons & épisodes'));
  const acc = document.createElement('div'); acc.className = 'season-acc';
  const seasons = (d.seasons || []).filter(s => s.season_number >= 1)
                                   .sort((a, b) => a.season_number - b.season_number);
  if (!seasons.length) {
    const e = document.createElement('div'); e.className = 'season-eps-loading'; e.textContent = 'Aucune saison disponible.';
    acc.appendChild(e);
  } else {
    for (const s of seasons) acc.appendChild(makeSeasonBlock(d.id, sid, s));
  }
  frag.appendChild(acc);
  return frag;
}

function makeSeasonBlock(seriesId, sid, season, opts) {
  opts = opts || {};
  const sn = season.season_number;
  const epCountMeta = season.episode_count || 0;
  let epList = null;          // épisodes bruts (chargés à la demande)
  let rendered = false;

  const block = document.createElement('div'); block.className = 'season-block';

  const head = document.createElement('div'); head.className = 'season-head';
  const chev = document.createElement('span'); chev.className = 'season-chevron'; chev.textContent = '▶';
  head.appendChild(chev);

  const info = document.createElement('div'); info.className = 'season-info';
  const nm = document.createElement('div'); nm.className = 'season-name'; nm.textContent = season.name || ('Saison ' + sn);
  const cnt = document.createElement('div'); cnt.className = 'season-count';
  info.appendChild(nm); info.appendChild(cnt);
  head.appendChild(info);

  const toggle = document.createElement('button'); toggle.className = 'season-toggle';
  toggle.title = 'Marquer les épisodes diffusés comme vus'; toggle.textContent = '✓';
  head.appendChild(toggle);
  block.appendChild(head);

  const epsWrap = document.createElement('div'); epsWrap.className = 'season-eps';
  block.appendChild(epsWrap);

  async function loadEpisodes() {
    if (epList) return epList;
    const data = await tmdb('/tv/' + seriesId + '/season/' + sn);
    epList = data.episodes || [];
    return epList;
  }

  function notifyChange() {
    invalidateWatchlist();             // marque la watchlist à reconstruire + badge à jour
    if (opts.onChange) opts.onChange();
  }

  function refreshHeader() {
    const seen = seasonWatchedCount(sid, sn);
    let suffix = '';
    if (epList) {
      const aired = epList.filter(e => isAired(e.air_date)).length;
      if (aired > 0 && seen >= aired) suffix = (aired >= epCountMeta) ? ' · vue' : ' · à jour';
    }
    cnt.textContent = seen + ' / ' + epCountMeta + ' épisodes' + suffix;
    const done = !!suffix;
    cnt.classList.toggle('done', done);
    toggle.classList.toggle('done', done);
  }

  function refreshEpRows() {
    const w = S.watched[sid] || {};
    epsWrap.querySelectorAll('.ep-row').forEach(row => {
      const chk = row.querySelector('.ep-check');
      if (chk.classList.contains('locked')) return;   // non diffusé : intouchable
      const seen = !!w[row.dataset.key];
      row.classList.toggle('seen', seen);
      chk.classList.toggle('seen', seen);
      chk.textContent = seen ? '✓' : '';
    });
  }

  head.addEventListener('click', async () => {
    const opening = !block.classList.contains('open');
    block.classList.toggle('open');
    if (opening && !rendered) {
      rendered = true;
      epsWrap.innerHTML = '<div class="season-eps-loading"><div class="spinner"></div><span>Chargement des épisodes…</span></div>';
      try {
        const eps = await loadEpisodes();
        epsWrap.innerHTML = '';
        if (!eps.length) { epsWrap.innerHTML = '<div class="season-eps-loading">Aucun épisode.</div>'; return; }
        for (const ep of eps) epsWrap.appendChild(makeEpRow(sid, ep, () => { refreshHeader(); notifyChange(); }));
        refreshHeader();
      } catch(err) {
        epsWrap.innerHTML = '<div class="season-eps-loading">Erreur de chargement.</div>';
        rendered = false;
      }
    }
  });

  toggle.addEventListener('click', async (e) => {
    e.stopPropagation();
    let eps;
    try { eps = await loadEpisodes(); } catch(err) { showToast('Erreur de chargement'); return; }
    const aired = eps.filter(ep => isAired(ep.air_date));
    if (!aired.length) { showToast('Aucun épisode encore diffusé'); return; }
    if (!S.watched[sid]) S.watched[sid] = {};
    const allSeen = aired.every(ep => S.watched[sid][epKey(ep.season_number, ep.episode_number)]);
    for (const ep of aired) {
      const k = epKey(ep.season_number, ep.episode_number);
      if (allSeen) delete S.watched[sid][k]; else S.watched[sid][k] = true;
    }
    saveState();
    notifyChange();
    if (rendered) refreshEpRows();
    refreshHeader();
    showToast(allSeen ? ('Saison ' + sn + ' marquée non vue') : ('✓ Saison ' + sn + ' marquée vue'));
  });

  refreshHeader();
  return block;
}

function makeEpRow(sid, ep, onChange) {
  const sn = ep.season_number, en = ep.episode_number;
  const key = epKey(sn, en);
  const aired = isAired(ep.air_date);
  const row = document.createElement('div'); row.className = 'ep-row' + (aired ? '' : ' upcoming'); row.dataset.key = key;

  const info = document.createElement('div'); info.className = 'ep-info';
  const t = document.createElement('div'); t.className = 'ep-title';
  const se = document.createElement('span'); se.className = 'se'; se.textContent = sxe(sn, en);
  t.appendChild(se);
  t.appendChild(document.createTextNode(ep.name || ''));
  info.appendChild(t);
  const dd = document.createElement('div'); dd.className = 'ep-date';
  if (ep.air_date) dd.textContent = (aired ? '📅 ' : '🕓 à venir · ') + fmtDate(ep.air_date);
  else dd.textContent = '🕓 date inconnue';
  info.appendChild(dd);
  row.appendChild(info);

  const chk = document.createElement('button'); chk.className = 'ep-check';
  row.appendChild(chk);

  if (!aired) {                       // pas encore diffusé : coche verrouillée, aucune interaction
    chk.classList.add('locked');
    chk.disabled = true;
    chk.title = 'Pas encore diffusé';
    return row;
  }

  chk.title = 'Marquer comme vu';
  function paint() {
    const seen = !!(S.watched[sid] && S.watched[sid][key]);
    row.classList.toggle('seen', seen);
    chk.classList.toggle('seen', seen);
    chk.textContent = seen ? '✓' : '';
  }
  chk.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!S.watched[sid]) S.watched[sid] = {};
    if (S.watched[sid][key]) delete S.watched[sid][key];
    else S.watched[sid][key] = true;
    saveState();
    paint();
    if (onChange) onChange();
  });

  paint();
  return row;
}

function closeModal() { _currentModalId = null; document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function handleModalClick(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══════════════════════════════════════════
   ICS (date connue, heure non fournie par TMDB → 21:00 par défaut)
═══════════════════════════════════════════ */
function fmtIcsLocal(dateStr, hour, min) {
  const d = new Date(dateStr); const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + 'T' + p(hour) + p(min) + '00';
}
function escIcs(s) { return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function downloadIcs(serieName, dateStr, epLabel) {
  const uid = 'seriestracker-' + Date.now() + '@local';
  const now = fmtIcsLocal(new Date().toISOString(), new Date().getHours(), new Date().getMinutes());
  const dtS = fmtIcsLocal(dateStr, 21, 0);
  const dtE = fmtIcsLocal(dateStr, 22, 0);
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Serie Tracker//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:' + uid, 'DTSTAMP:' + now,
    'DTSTART;TZID=Europe/Paris:' + dtS, 'DTEND;TZID=Europe/Paris:' + dtE,
    'SUMMARY:' + escIcs('📺 ' + serieName + ' — ' + epLabel),
    'DESCRIPTION:' + escIcs('Diffusion : ' + serieName + ' ' + epLabel + ' (heure indicative)'),
    'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:' + escIcs('Diffusion — ' + serieName),
    'END:VALARM','END:VEVENT','END:VCALENDAR',
  ].join('\r\n');
  const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = (serieName + '.ics').replace(/[/:*?"<>|]/g,'-'); a.click();
  URL.revokeObjectURL(url);
  showToast('📅 Ajouté au calendrier');
}

/* ═══════════════════════════════════════════
   EXPORT / IMPORT  (fusion union pour iCloud)
═══════════════════════════════════════════ */
function exportData() {
  const payload = { version:1, exported:new Date().toISOString(), series:S.series, watched:S.watched };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'series-tracker.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✓ ' + S.series.length + ' série(s) exportée(s)');
}
function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.series || !Array.isArray(data.series)) throw new Error('Format invalide');
      let added = 0;
      for (const s of data.series) {
        if (!s.id || !s.name) continue;
        if (!S.series.some(x => x.id === s.id)) { S.series.push(s); added++; }
      }
      // union des épisodes vus (vu sur un appareil = vu partout)
      if (data.watched && typeof data.watched === 'object') {
        for (const sid in data.watched) {
          if (!S.watched[sid]) S.watched[sid] = {};
          for (const k in data.watched[sid]) { if (data.watched[sid][k]) S.watched[sid][k] = true; }
        }
      }
      saveState(); updateBadges();
      watchlistBuilt = false;
      showToast(added > 0 ? '✓ ' + added + ' série(s) importée(s)' : '✓ Vu(s) fusionné(s)');
      const active = document.querySelector('.tab-panel.active');
      if (active && active.id === 'tab-myseries') renderMySeries();
    } catch(err) { showToast('✗ ' + err.message); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
loadState();
updateBadges();
tabLoaded.discover = true;
loadPopular();
</script>
